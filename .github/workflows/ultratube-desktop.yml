name: Ultratube Desktop (Windows, Linux, macOS)

# Unsigned desktop builds of the Ultratube shell (YouTube feed, own player,
# Twitch without ads, live chat, Ask/Gemini). Run manually from the Actions
# tab, or called by release.yml; each job uploads its package as an artifact.
on:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: '3.47.4'

defaults:
  run:
    working-directory: ppplayer
    shell: bash

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          $v = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -replace 'version:\s*','' -replace '\+.*','').Trim()
          Copy-Item ../LICENSE, ../THIRD_PARTY_NOTICES.md build/windows/x64/runner/Release/
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "Ultratube-$v-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Ultratube-Windows-x64
          path: ppplayer/Ultratube-*-windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies (GTK, libmpv, libsecret)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxcb1-dev libstdc++-12-dev libvulkan-dev libsecret-1-dev libjsoncpp-dev libwebkit2gtk-4.1-dev \
            libmpv-dev libepoxy-dev libfuse2 file
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package tarball
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//' | tr -d ' \r')
          echo "V=$V" >> "$GITHUB_ENV"
          cp ../LICENSE ../THIRD_PARTY_NOTICES.md build/linux/x64/release/bundle/
          tar -czf "Ultratube-$V-linux-x64.tar.gz" -C build/linux/x64/release/bundle .
      - name: Package AppImage (bundles libmpv and other shared libraries)
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          curl -fsSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          rm -rf AppDir && mkdir -p AppDir/usr/bin
          cp -a build/linux/x64/release/bundle/. AppDir/usr/bin/
          cp ../docs/portfolio/logo/ultratube-icon-512.png ultratube.png
          cat > ultratube.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Ultratube
          Comment=Ad-free YouTube, YouTube Music and Twitch
          Exec=ppplayer
          Icon=ultratube
          Categories=AudioVideo;Video;Player;
          Terminal=false
          EOF
          ./linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/ppplayer \
            --deploy-deps-only AppDir/usr/bin/lib \
            --desktop-file ultratube.desktop --icon-file ultratube.png \
            --output appimage
          mv Ultratube-*.AppImage "Ultratube-$V-x86_64.AppImage"
          ls -lh Ultratube-*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: Ultratube-Linux-x64
          path: |
            ppplayer/Ultratube-*-linux-x64.tar.gz
            ppplayer/Ultratube-*-x86_64.AppImage
          if-no-files-found: error

  macos:
    name: macOS (universal, ad-hoc signed)
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Ad-hoc signing (no Apple certificate needed)
        run: |
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "-";/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-";/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' macos/Runner.xcodeproj/project.pbxproj
      - run: flutter build macos --release
      - name: Package
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//' | tr -d ' \r')
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          ditto -c -k --keepParent "$APP" "Ultratube-$V-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Ultratube-macOS
          path: ppplayer/Ultratube-*-macos.zip
          if-no-files-found: error
