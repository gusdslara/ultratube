name: Ultratube Desktop (Windows, Linux, macOS)

# Unsigned desktop builds of the Ultratube shell (YouTube feed, own player,
# Twitch without ads, live chat, Perguntar/Gemini). Run manually from the
# Actions tab; each job uploads its bundle as an artifact.
on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.4'

defaults:
  run:
    working-directory: ppplayer

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Ultratube-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Ultratube-Windows-x64
          path: ppplayer/Ultratube-Windows-x64.zip

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies (GTK, libmpv, libsecret)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxcb1-dev libstdc++-11-dev libvulkan-dev libsecret-1-dev libjsoncpp-dev libwebkit2gtk-4.1-dev \
            libmpv-dev libepoxy-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package
        run: tar -czf Ultratube-Linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: Ultratube-Linux-x64
          path: ppplayer/Ultratube-Linux-x64.tar.gz

  macos:
    name: macOS (universal, ad-hoc signed)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Ad-hoc signing (no Apple certificate needed)
        run: |
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "-";/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-";/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' macos/Runner.xcodeproj/project.pbxproj
      - run: flutter build macos --release
      - name: Package
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          ditto -c -k --keepParent "$APP" Ultratube-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Ultratube-macOS
          path: ppplayer/Ultratube-macOS.zip
