# Shared by BOTH Gradle builds that compile android/media:
#   android/                (watch: :media + :wear)
#   ppplayer/android/       (phone: :app + :ultratube-media), imported in its settings.gradle.kts
# One place for the versions of what the two apps share, so the module never
# builds against one library on the phone and another on the watch.
# (Android Gradle Plugin/Kotlin stay per build: Flutter pins its own.)

[versions]
compileSdk = "35"
minSdkMedia = "26"
minSdkWear = "30"
media3 = "1.5.1"
newpipe = "v0.27.1"
okhttp = "4.12.0"
coroutines = "1.10.1"
coreKtx = "1.13.1"
wearOngoing = "1.0.0"
zxing = "3.5.3"
viewpager2 = "1.1.0"
activity = "1.9.3"
junit = "4.13.2"
json = "20240303"

[libraries]
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
newpipe-extractor = { module = "com.github.TeamNewPipe:NewPipeExtractor", version.ref = "newpipe" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
wear-ongoing = { module = "androidx.wear:wear-ongoing", version.ref = "wearOngoing" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }

[bundles]
media3 = ["media3-exoplayer", "media3-exoplayer-hls", "media3-session", "media3-ui"]
